<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA GESTIÓN PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg-principal: #0f172a; --bg-tarjeta: #1e293b; --texto-titulos: #f8fafc; --verde-exito: #22c55e; --azul: #3b82f6; }
        body { font-family: sans-serif; background-color: var(--bg-principal); color: var(--texto-titulos); margin: 0; padding: 20px; }
        .contenedor { max-width: 500px; margin: 0 auto; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .opcion-btn { background: var(--bg-tarjeta); padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; }
        .seccion { background: var(--bg-tarjeta); padding: 15px; border-radius: 10px; margin-top: 15px; display: none; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: var(--verde-exito); border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>SISTEMA GESTIÓN PRO</h1>
        <nav class="menu-grid">
            <div class="opcion-btn" onclick="toggle('form-cliente')">➕ Cliente</div>
            <div class="opcion-btn" onclick="toggle('form-venta')">💰 Venta</div>
        </nav>

        <div id="form-cliente" class="seccion">
            <h3>Registrar Cliente</h3>
            <input type="text" id="nombreCliente" placeholder="Nombre del Cliente">
            <button onclick="guardarCliente()">GUARDAR CLIENTE</button>
        </div>

        <div id="form-venta" class="seccion">
            <h3>Nueva Venta</h3>
            <select id="selectCliente"><option value="">Selecciona un cliente</option></select>
            <input type="text" id="producto" placeholder="Producto">
            <input type="number" id="monto" placeholder="Monto">
            <button onclick="guardarVenta()">REGISTRAR</button>
        </div>

        <div id="lista-ventas" class="seccion" style="display: block;">
            <h3>Historial</h3>
            <table id="tablaVentas" width="100%"><thead><tr><th>Cliente</th><th>Prod</th><th>$</th></tr></thead><tbody></tbody></table>
        </div>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('clientes')) || [];
        function toggle(id) { document.getElementById(id).style.display = document.getElementById(id).style.display === 'block' ? 'none' : 'block'; }
        
        function guardarCliente() {
            let nombre = document.getElementById('nombreCliente').value;
            if(nombre) {
                clientes.push(nombre);
                localStorage.setItem('clientes', JSON.stringify(clientes));
                actualizarSelect();
                alert("Cliente guardado");
            }
        }

        function actualizarSelect() {
            let sel = document.getElementById('selectCliente');
            sel.innerHTML = '<option value="">Selecciona un cliente</option>';
            clientes.forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
        }

        function guardarVenta() {
            let cliente = document.getElementById('selectCliente').value;
            let prod = document.getElementById('producto').value;
            let monto = document.getElementById('monto').value;
            if(cliente && prod && monto) {
                let tabla = document.getElementById('tablaVentas').getElementsByTagName('tbody')[0];
                tabla.innerHTML += `<tr><td>${cliente}</td><td>${prod}</td><td>$${monto}</td></tr>`;
                alert("Venta registrada");
            }
        }
        actualizarSelect();
    </script>
</body>
</html>
