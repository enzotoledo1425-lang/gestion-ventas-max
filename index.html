<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN DASHBOARD MAX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-principal: #0f172a;
            --bg-tarjeta: #1e293b;
            --texto-titulos: #ffffff;
            --texto-secundario: #94a3b8;
            --verde-exito: #10b981;
            --rojo: #f43f5e;
            --azul: #3b82f6;
            --borde: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-titulos);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .contenedor {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        header p {
            color: var(--azul);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.75rem;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, #64748b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* Cuadrícula de Botones Principales */
        .grid-botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-cuadrado {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
        }

        .btn-cuadrado i {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: block;
        }

        .btn-cuadrado span {
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Botones Anchos de Lista */
        .btn-ancho {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .btn-ancho i {
            font-size: 1.4rem;
        }

        .btn-ancho span {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <header>
            <p>Admin Dashboard</p>
            <h1>MAX</h1>
        </header>

        <div class="grid-botones">
            <div class="btn-cuadrado">
                <i class="fas fa-plus-circle" style="color: #f59e0b;"></i>
                <span>Venta</span>
            </div>
            <div class="btn-cuadrado">
                <i class="fas fa-user-plus" style="color: #3b82f6;"></i>
                <span>Clientes</span>
            </div>
            <div class="btn-cuadrado">
                <i class="fas fa-hand-holding-usd" style="color: #f43f5e;"></i>
                <span>Deudores</span>
            </div>
            <div class="btn-cuadrado">
                <i class="fas fa-wallet" style="color: #10b981;"></i>
                <span>Balance</span>
            </div>
        </div>

        <div class="btn-ancho">
            <i class="fas fa-chart-line" style="color: #a78bfa;"></i>
            <span>Rendimiento Vendedores</span>
        </div>

        <div class="btn-ancho">
            <i class="fas fa-user-cog" style="color: #94a3b8;"></i>
            <span>Gestión de Personal</span>
        </div>

        <div class="btn-ancho">
            <i class="fas fa-list-ul" style="color: #ffffff;"></i>
            <span>Historial de Actividad</span>
        </div>
    </div>

</body>
</html>
