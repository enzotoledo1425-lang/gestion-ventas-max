<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA GESTIÓN PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-principal: #0f172a;
            --bg-tarjeta: #1e293b;
            --texto-titulos: #ffffff;
            --texto-secundario: #94a3b8;
            --verde-exito: #10b981;
            --rojo: #f43f5e;
            --azul: #3b82f6;
            --borde: #334155;
            --accent: #8b5cf6;
            --naranja: #e67e22;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-principal); 
            color: var(--texto-titulos); 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
        }

        .contenedor { 
            width: 100%;
            max-width: 600px; 
        }

        header { 
            text-align: center;
            margin-bottom: 30px; 
            padding-top: 20px;
        }

        header p {
            color: var(--azul);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.75rem;
            margin-bottom: 5px;
        }

        h1 { 
            font-size: 3.5rem; 
            margin: 0; 
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, #64748b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Sección de Expiración en Inicio */
        .expiration-container {
            background: #161f30;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 25px;
            border: 1px solid var(--borde);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .expiration-header h3 {
            color: #4a90e2;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .expiration-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Barras de Scroll personalizadas */
        .expiration-list::-webkit-scrollbar { width: 5px; }
        .expiration-list::-webkit-scrollbar-track { background: transparent; }
        .expiration-list::-webkit-scrollbar-thumb { background: var(--borde); border-radius: 10px; }

        .expiration-card {
            background: var(--bg-tarjeta);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-left: 4px solid #64748b;
        }

        .expiration-card.status-active { border-left-color: var(--verde-exito); }
        .expiration-card.status-warning { border-left-color: var(--naranja); }
        .expiration-card.status-expired { border-left-color: var(--rojo); background: #251b22; }

        .client-info { display: flex; justify-content: space-between; align-items: center; }
        .client-name { color: #ffffff; font-weight: 600; font-size: 1.05rem; }
        .client-status { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; font-weight: bold; text-transform: uppercase; }

        .status-active .client-status { background: rgba(16, 185, 129, 0.2); color: var(--verde-exito); }
        .status-warning .client-status { background: rgba(230, 126, 34, 0.2); color: var(--naranja); }
        .status-expired .client-status { background: rgba(244, 63, 94, 0.2); color: var(--rojo); }

        .date-info { display: flex; justify-content: space-between; background: rgba(0, 0, 0, 0.2); padding: 8px; border-radius: 8px; }
        .date-info small { color: var(--texto-secundario); display: block; font-size: 0.65rem; text-transform: uppercase; }
        .date-info p { color: #e2e8f0; margin: 2px 0 0 0; font-size: 0.8rem; font-family: monospace; }
        
        .remaining-time { display: flex; justify-content: flex-end; }
        .days-left-badge { font-size: 0.75rem; font-weight: bold; padding: 4px 10px; border-radius: 6px; }
        .status-active .days-left-badge { background: #1c2d3d; color: #3498db; }
        .status-warning .days-left-badge { background: #5e3319; color: var(--naranja); }
        .status-expired .days-left-badge { background: #7b241c; color: var(--rojo); }

        .no-clients-text { color: var(--texto-secundario); font-size: 0.9rem; text-align: center; margin: 10px 0; }

        /* Grid de Menú */
        .menu-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 25px; 
        }

        .opcion-btn { 
            background: var(--bg-tarjeta); 
            border: 1px solid var(--borde); 
            border-radius: 16px; 
            padding: 20px 15px; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 12px; 
            color: var(--texto-titulos); 
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .opcion-btn:hover {
            border-color: var(--azul);
            transform: translateY(-2px);
            background: #243147;
        }

        .opcion-btn i { font-size: 1.5rem; }
        .opcion-btn span { font-size: 0.9rem; font-weight: 500; }

        .btn-full { 
            grid-column: span 2; 
            flex-direction: row; 
            padding: 15px; 
            justify-content: center; 
        }

        /* Secciones Estilizadas */
        .seccion { 
            background: var(--bg-tarjeta); 
            padding: 25px; 
            border-radius: 20px; 
            margin-top: 20px; 
            display: none; 
            border: 1px solid var(--borde);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h3 { margin-top: 0; margin-bottom: 20px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
