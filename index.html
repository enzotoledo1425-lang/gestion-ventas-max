<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA GESTIÓN PRO</title>
    <style>
        :root { --bg-principal: #0f172a; --bg-tarjeta: #1e293b; --texto-titulos: #f8fafc; --verde-exito: #22c55e; --rojo: #ef4444; }
        body { font-family: sans-serif; background-color: var(--bg-principal); color: var(--texto-titulos); margin: 0; padding: 20px; }
        .contenedor { max-width: 500px; margin: 0 auto; }
        .seccion { background: var(--bg-tarjeta); padding: 15px; border-radius: 10px; margin-top: 15px; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        .btn-verde { background: var(--verde-exito); }
        .btn-rojo { background: var(--rojo); }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>SISTEMA GESTIÓN PRO</h1>
        
        <div class="seccion">
            <h3>Registrar Venta</h3>
            <select id="selCliente"><option value="">Cliente</option></select>
            <input type="text" id="prod" placeholder="Producto">
            <input type="number" id="monto" placeholder="Monto">
            <select id="estado"><option value="Pagado">Pagado</option><option value="Deuda">Deuda</option></select>
            <button class="btn-verde" onclick="registrar()">REGISTRAR VENTA</button>
        </div>

        <div class="seccion">
            <h3>Deudores</h3>
            <table width="100%" id="tablaDeuda"><tr><th>Cliente</th><th>$</th></tr></table>
        </div>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('clientes')) || [];
        function registrar() {
            let cliente = document.getElementById('selCliente').value;
            let monto = document.getElementById('monto').value;
            let estado = document.getElementById('estado').value;
            if(estado === 'Deuda') {
                let tabla = document.getElementById('tablaDeuda');
                tabla.innerHTML += `<tr><td>${cliente}</td><td>$${monto}</td></tr>`;
            }
            alert("Registrado como: " + estado);
        }
        // Cargar clientes en el select
        let sel = document.getElementById('selCliente');
        clientes.forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
    </script>
</body>
</html>
