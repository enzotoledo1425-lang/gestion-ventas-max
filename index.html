<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN DASHBOARD MAX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-principal: #0f172a;
            --bg-tarjeta: #1e293b;
            --texto-titulos: #ffffff;
            --texto-secundario: #94a3b8;
            --verde-exito: #10b981;
            --rojo: #f43f5e;
            --azul: #3b82f6;
            --borde: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-titulos);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .contenedor {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, #64748b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* Cuadrícula de Botones Principales */
        .grid-botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-cuadrado {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-cuadrado:active { transform: scale(0.95); }

        .btn-cuadrado i {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: block;
        }

        .btn-cuadrado span {
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Botones Anchos de Lista */
        .btn-ancho {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-ancho:active { transform: scale(0.98); }
        .btn-ancho i { font-size: 1.4rem; }
        .btn-ancho span { font-weight: 600; font-size: 0.9rem; text-transform: uppercase; }

        /* Apartado de Vencimientos */
        .apartado-clientes {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 20px;
            margin-top: 25px;
        }

        .apartado-clientes h2 {
            font-size: 1.1rem;
            color: var(--azul);
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Formulario de Ingreso */
        .form-ingreso {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--borde);
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .campo-grupo label {
            font-size: 0.75rem;
            color: var(--texto-secundario);
            text-transform: uppercase;
            font-weight: bold;
        }

        .form-ingreso input {
            background: var(--bg-principal);
            border: 1px solid var(--borde);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .form-ingreso button {
            background: var(--azul);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .form-ingreso button:active { transform: scale(0.98); }

        /* Tabla de Datos */
        .tabla-clientes {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .tabla-clientes th {
            color: var(--texto-secundario);
            font-size: 0.75rem;
            text-transform: uppercase;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--borde);
        }

        .tabla-clientes td {
            padding: 12px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
        }

        .col-cliente { font-weight: 600; color: #fff; }
        .col-fecha { color: var(--texto-secundario); }
        .col-expira { color: var(--verde-exito); font-weight: bold; }
        
        .btn-borrar {
            background: transparent;
            border: none;
            color: var(--rojo);
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
