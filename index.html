<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN DASHBOARD MAX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-principal: #0f172a;
            --bg-tarjeta: #1e293b;
            --texto-titulos: #ffffff;
            --texto-secundario: #94a3b8;
            --verde-exito: #10b981;
            --rojo: #f43f5e;
            --azul: #3b82f6;
            --borde: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-titulos);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .contenedor {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        header p {
            color: var(--azul);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.75rem;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, #64748b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* Cuadrícula de Botones Principales (Igual a tu foto) */
        .grid-botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-cuadrado {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
        }

        .btn-cuadrado i {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: block;
        }

        .btn-cuadrado span {
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Botones Anchos de Lista (Igual a tu foto) */
        .btn-ancho {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-ancho i {
            font-size: 1.4rem;
        }

        .btn-ancho span {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* NUEVO APARTADO: Control de Clientes con columnas */
        .apartado-clientes {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 20px;
            margin-top: 25px;
        }

        .apartado-clientes h2 {
            font-size: 1.1rem;
            color: var(--azul);
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tabla o columnas para Cliente / F. Ingreso / F. Expiración */
        .tabla-clientes {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .tabla-clientes th {
            color: var(--texto-secundario);
            font-size: 0.75rem;
            text-transform: uppercase;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--borde);
        }

        .tabla-clientes td {
            padding: 12px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
        }

        .col-cliente { font-weight: 600; color: #fff; }
        .col-fecha { color: var(--texto-secundario); }
        .col-expira { color: var(--verde-exito); font-weight: bold; }
        .col-expira.vence-ya { color: var(--rojo); }
    </style>
</head>
<body>

    <div class="contenedor">
        <header>
            <p>Admin Dashboard</p>
            <h1>MAX</h1>
        </header>

        <div class="grid-botones">
            <div class="btn-cuadrado">
                <i class="fas fa-plus-circle" style="color: #f59e0b;"></i>
                <span>Venta</span>
            </div>
            <div class="btn-cuadrado">
                <i class="fas fa-user-plus" style="color: #3b82f6;"></i>
                <span>Clientes</span>
            </div>
            <div class="btn-cuadrado">
                <i class="fas fa-hand-holding-usd" style="color: #f43f5e;"></i>
                <span>Deudores</span>
            </div>
            <div class="btn-cuadrado">
                <i class="fas fa-wallet" style="color: #10b981;"></i>
                <span>Balance</span>
            </div>
        </div>

        <div class="btn-ancho">
            <i class="fas fa-chart-line" style="color: #a78bfa;"></i>
            <span>Rendimiento Vendedores</span>
        </div>

        <div class="btn-ancho">
            <i class="fas fa-user-cog" style="color: #94a3b8;"></i>
            <span>Gestión de Personal</span>
        </div>

        <div class="btn-ancho">
            <i class="fas fa-list-ul" style="color: #ffffff;"></i>
            <span>Historial de Actividad</span>
        </div>

        <div class="apartado-clientes">
            <h2><i class="fas fa-users-cog"></i> Control de Vencimientos</h2>
            
            <table class="tabla-clientes">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>F. Ingreso</th>
                        <th>F. Expiración</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-cliente">Carlos Rodriguez</td>
                        <td class="col-fecha">10/05/2026</td>
                        <td class="col-expira">10/06/2026</td>
                    </tr>
                    <tr>
                        <td class="col-cliente">Marcos Paz</td>
                        <td class="col-fecha">20/04/2026</td>
                        <td class="col-expira vence-ya">
