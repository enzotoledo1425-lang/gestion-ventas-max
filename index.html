<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA GESTIÓN MAX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .contenedor {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 5px;
        }
        p.sub {
            color: #00bfff;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-top: 0;
        }
        .caja {
            background: #141a24;
            border: 1px solid #222f3e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }
        .caja h3 {
            color: #00ffcc;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <header>
            <p class="sub">Panel de Administración</p>
            <h1>SISTEMA GESTIÓN MAX</h1>
        </header>

        <div class="caja">
            <h3><i class="fas fa-clock"></i> Control de Estados</h3>
            <p style="color: #a0aec0; margin: 0;">Esperando datos del sistema...</p>
        </div>

        <div class="caja">
            <h3 style="color: #00bfff;"><i class="fas fa-sliders-h"></i> Configuración</h3>
            <p style="color: #a0aec0; margin: 0;">Panel listo para operar.</p>
        </div>
    </div>

</body>
</html>
