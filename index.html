<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA GESTIÓN PRO</title>
    <!-- Iconos profesionales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-principal: #0f172a; /* Azul oscuro mate */
            --bg-tarjeta: #1e293b;   /* Gris azulado para botones */
            --texto-titulos: #f8fafc;
            --texto-secundario: #94a3b8;
            --borde-suave: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-titulos);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .contenedor {
            width: 100%;
            max-width: 450px;
            padding: 40px 20px;
            text-align: center;
        }

        header p {
            color: var(--texto-secundario);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            margin: 10px 0;
        }

        .usuario-actual {
            margin-bottom: 35px;
            font-size: 1rem;
            color: var(--texto-titulos);
        }

        .usuario-actual span {
            font-weight: 600;
            color: #ffffff;
        }

        /* Cuadrícula de Navegación */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .opcion-btn {
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde-suave);
            border-radius: 10px;
            padding: 25px 15px;
            text-decoration: none;
            color: var(--texto-titulos);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: background-color 0.2s ease;
        }

        .opcion-btn:hover {
            background-color: #2d3a4f;
        }

        .opcion-btn i {
            font-size: 1.4rem;
        }

        /* Botones de ancho completo */
        .btn-full {
            grid-column: span 2;
            flex-direction: row;
            justify-content: center;
            padding: 18px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        /* Colores de Iconos (Sobrios) */
        .color-venta { color: #eab308; } /* Dorado suave */
        .color-clientes { color: #3b82f6; } /* Azul corporativo */
        .color-deudores { color: #ef4444; } /* Rojo suave */
        .color-ganancias { color: #22c55e; } /* Verde suave */
        .color-admin { color: #94a3b8; }

        /* Estilo especial para Deudores según la imagen */
        .btn-deudores {
            border: 1.5px solid rgba(239, 68, 68, 0.5);
        }

        footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: var(--texto-secundario);
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <header>
            <p>Panel de Control General</p>
            <h1>SISTEMA GESTIÓN PRO</h1>
        </header>

        <div class="usuario-actual">
            Bienvenido: <span>Maxi Toledo</span>
        </div>

        <nav class="menu-grid">
            <!-- Registrar Venta -->
            <a href="#" class="opcion-btn">
                <i class="fa-solid fa-box-open color-venta"></i>
                <span>Registrar Venta</span>
            </a>

            <!-- Lista de Clientes -->
            <a href="#" class="opcion-btn">
                <i class="fa-solid fa-users color-clientes"></i>
                <span>Clientes</span>
            </a>

            <!-- Deudores -->
            <a href="#" class="opcion-btn btn-deudores">
                <i class="fa-solid fa-triangle-exclamation color-deudores"></i>
                <span>Deudores</span>
            </a>

            <!-- Ganancias -->
            <a href="#" class="opcion-btn">
                <i class="fa-solid fa-money-bill-trend-up color-ganancias"></i>
                <span>Mis Ganancias</span>
            </a>

            <!-- Ganancias por Vendedor -->
            <a href="#" class="opcion-btn btn-full">
                <i class="fa-solid fa-chart-pie color-admin" style="margin-right: 10px;"></i>
                Ganancias por Vendedor
            </a>

            <!-- Administrar Trabajadores -->
            <a href="#" class="opcion-btn btn-full">
                <i class="fa-solid fa-id-card-clip color-admin" style="margin-right: 10px;"></i>
                Administrar Trabajadores y Roles
            </a>
        </nav>

        <footer>
            Administración de Sistema &copy; 2026
        </footer>
    </div>

</body>
</html>
